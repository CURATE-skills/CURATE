ir_version: "0.1"
name: diamond-ice-demo
description: Synthetic 4-node diamond shaped like an ice-phenology task (not the real task)
defaults:
  image: docker:///python:3.12-slim
  resources: {cpus: 1, memory_mb: 1024}
inputs:
  - file: params.json
    location: input/params.json             # relative to this file
nodes:
  - id: load_data
    code: functions/load_data.py
    inputs:  {params: params.json}
    outputs: {daily: daily.csv}
  - id: freeze_up
    code: functions/freeze_up.py
    inputs:  {daily: daily.csv}
    outputs: {freeze: freeze.csv}
    params:  {run_days: 5}
  - id: ice_off
    code: functions/ice_off.py
    inputs:  {daily: daily.csv}
    outputs: {iceoff: iceoff.csv}
    params:  {run_days: 5}
  - id: assemble
    code: functions/assemble.py
    inputs:  {freeze: freeze.csv, iceoff: iceoff.csv}
    outputs: {result: ice_phenology_result.json}
outputs:
  - file: ice_phenology_result.json
    deliver_as: results/ice_phenology_result.json
