cwlVersion: v1.2
class: Workflow
$namespaces:
  curate: https://github.com/CURATE-skills/CURATE/blob/main/docs/CWL_IR.md#
requirements:
  ScatterFeatureRequirement: {}
  MultipleInputFeatureRequirement: {}
hints:
  DockerRequirement: {dockerPull: "python:3.12-slim"}

inputs:
  rank3: {type: "int[]", default: [1, 2, 3]}
  rank5: {type: "int[]", default: [1, 2, 3, 4, 5]}
  batches:                                # external family batch_{rank3}.txt
    type: File[]
    default:
      - {class: File, location: inputs/batch_1.txt}
      - {class: File, location: inputs/batch_2.txt}
      - {class: File, location: inputs/batch_3.txt}
  notes: {type: File, default: {class: File, location: inputs/notes.txt}}

outputs:
  report_json:
    type: File
    outputSource: report/output1
    curate:deliver_as: results/report.json

steps:
  map:                                    # pairs batch i with rank i
    scatter: [rank, input1]
    scatterMethod: dotproduct
    in: {input1: batches, rank: rank3, max_rank: {default: 3}}
    out: [output1]
    run: {class: Operation, inputs: {input1: File, rank: int, max_rank: int}, outputs: {output1: File}}
    hints:
      curate:function: {code: functions/map.py, entrypoint: main}
      curate:secrets: {names: [API_TOKEN]}

  shuffle:                                # folder from two sources; one step writes 5 files
    in:
      input1:
        source: [map/output1, notes]
        linkMerge: merge_flattened
        curate:folder: true
    out: [output1]
    run: {class: Operation, inputs: {input1: "File[]"}, outputs: {output1: "File[]"}}
    hints:
      curate:function: {code: functions/shuffle.py, entrypoint: main}

  reduce:                                 # copy i reads file i of the list
    scatter: [rank, input1]
    scatterMethod: dotproduct
    in: {input1: shuffle/output1, rank: rank5, max_rank: {default: 5}}
    out: [output1]
    run: {class: Operation, inputs: {input1: File, rank: int, max_rank: int}, outputs: {output1: File}}
    hints:
      curate:function: {code: functions/reduce.py, entrypoint: main}

  check:                                  # returns true/false
    in: {input1: reduce/output1}
    out: []
    run: {class: Operation, inputs: {input1: "File[]"}, outputs: {}}
    hints:
      curate:function: {code: functions/check.py, entrypoint: main}

  report:                                 # runs only if check returned true
    in: {input1: reduce/output1}
    out: [output1]
    run: {class: Operation, inputs: {input1: "File[]"}, outputs: {output1: File}}
    hints:
      curate:function: {code: functions/report.py, entrypoint: main}
      curate:run_if: {step: check, result: true}

  cleanup:                                # no file from report; runs after it
    in: {}
    out: []
    run: {class: Operation, inputs: {}, outputs: {}}
    hints:
      curate:function: {code: functions/cleanup.py, entrypoint: main}
      curate:after: {steps: [report]}
