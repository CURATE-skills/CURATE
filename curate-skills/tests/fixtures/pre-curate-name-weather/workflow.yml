cwlVersion: v1.2
class: Workflow
$namespaces:
  curate: https://github.com/CURATE-skills/CURATE/blob/main/docs/CWL_IR.md#
label: corvallis_winter_weather_comparison
doc: Compare winter 2025 weather in Corvallis, Oregon (GHCN-Daily station USC00351862)
  against the previous 10-year daily average for PRCP, TMIN and TMAX.
requirements:
  ScatterFeatureRequirement: {}
hints:
  DockerRequirement:
    dockerPull: python:3.12-slim
  ResourceRequirement:
    coresMin: 1
    ramMin: 2048
inputs:
  rank3:
    type: int[]
    default:
    - 1
    - 2
    - 3
outputs:
  corvallis_winter_comparison_png:
    type: File
    outputSource: plot_weather_comparison/output1
    curate:deliver_as: results/corvallis_winter_comparison.png
steps:
  download_ghcn_station:
    in: {}
    out:
    - output1
    run:
      class: Operation
      inputs: {}
      outputs:
        output1: File
    hints:
      curate:function:
        code: functions/download_ghcn_station.py
        entrypoint: main
      SoftwareRequirement:
        packages:
        - package: requests
  process_weather_variable:
    scatter: rank
    in:
      rank: rank3
      max_rank:
        default: 3
      input1: download_ghcn_station/output1
    out:
    - output1
    run:
      class: Operation
      inputs:
        rank: int
        max_rank: int
        input1: File
      outputs:
        output1: File
    hints:
      curate:function:
        code: functions/process_weather_variable.py
        entrypoint: main
      SoftwareRequirement:
        packages:
        - package: pandas
  plot_weather_comparison:
    in:
      input1:
        source: process_weather_variable/output1
        curate:folder: true
    out:
    - output1
    run:
      class: Operation
      inputs:
        input1: File[]
      outputs:
        output1: File
    hints:
      curate:function:
        code: functions/plot_weather_comparison.py
        entrypoint: main
      SoftwareRequirement:
        packages:
        - package: pandas
        - package: matplotlib
