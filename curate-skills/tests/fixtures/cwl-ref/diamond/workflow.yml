cwlVersion: v1.2
class: Workflow
$namespaces:
  curate: https://github.com/CURATE-skills/CURATE/blob/main/docs/CWL_IR.md#
label: diamond-ice-demo
doc: Synthetic 4-node diamond shaped like an ice-phenology task (not the real task)
hints:
  DockerRequirement:
    dockerPull: python:3.12-slim
  ResourceRequirement:
    coresMin: 1
    ramMin: 1024
inputs:
  params_json:
    type: File
    default:
      class: File
      location: input/params.json
outputs:
  ice_phenology_result_json:
    type: File
    outputSource: assemble/result
    curate:deliver_as: results/ice_phenology_result.json
steps:
  load_data:
    in:
      params: params_json
    out:
    - daily
    run:
      class: Operation
      inputs:
        params: File
      outputs:
        daily:
          type: File
          curate:name: daily.csv
    hints:
      curate:function:
        code: functions/load_data.py
        entrypoint: main
  freeze_up:
    in:
      run_days:
        default: 5
      daily: load_data/daily
    out:
    - freeze
    run:
      class: Operation
      inputs:
        run_days: int
        daily: File
      outputs:
        freeze:
          type: File
          curate:name: freeze.csv
    hints:
      curate:function:
        code: functions/freeze_up.py
        entrypoint: main
  ice_off:
    in:
      run_days:
        default: 5
      daily: load_data/daily
    out:
    - iceoff
    run:
      class: Operation
      inputs:
        run_days: int
        daily: File
      outputs:
        iceoff:
          type: File
          curate:name: iceoff.csv
    hints:
      curate:function:
        code: functions/ice_off.py
        entrypoint: main
  assemble:
    in:
      freeze: freeze_up/freeze
      iceoff: ice_off/iceoff
    out:
    - result
    run:
      class: Operation
      inputs:
        freeze: File
        iceoff: File
      outputs:
        result:
          type: File
          curate:name: ice_phenology_result.json
    hints:
      curate:function:
        code: functions/assemble.py
        entrypoint: main
