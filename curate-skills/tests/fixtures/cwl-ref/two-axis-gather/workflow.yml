cwlVersion: v1.2
class: Workflow
$namespaces:
  curate: https://github.com/CURATE-skills/CURATE/blob/main/docs/CWL_IR.md#
label: t
requirements:
  ScatterFeatureRequirement: {}
hints:
  DockerRequirement:
    dockerPull: python:3.12-slim
inputs:
  r:
    type: int[]
    default:
    - 1
    - 2
  w:
    type: string[]
    default:
    - a
    - b
outputs:
  res_json:
    type: File
    outputSource: g/res
    curate:deliver_as: res.json
  o_r_w:
    type: File[][]
    outputSource: m/o
    curate:deliver_as: all/{w}/{r}.txt
steps:
  m:
    scatter:
    - rank
    - name
    scatterMethod: nested_crossproduct
    in:
      rank: r
      name: w
    out:
    - o
    run:
      class: Operation
      inputs:
        rank: int
        name: string
      outputs:
        o:
          type: File
          curate:name: o_{r}_{w}
    hints:
      curate:function:
        code: functions/m.py
        entrypoint: main
  g:
    in:
      all: m/o
    out:
    - res
    run:
      class: Operation
      inputs:
        all: File[][]
      outputs:
        res:
          type: File
          curate:name: res.json
    hints:
      curate:function:
        code: functions/g.py
        entrypoint: main
