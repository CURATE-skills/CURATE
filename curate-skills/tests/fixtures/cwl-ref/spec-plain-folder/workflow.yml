cwlVersion: v1.2
class: Workflow
$namespaces:
  curate: https://github.com/CURATE-skills/CURATE/blob/main/docs/CWL_IR.md#
label: t2
doc: t2
requirements:
  MultipleInputFeatureRequirement: {}
hints:
  DockerRequirement:
    dockerPull: python:3.12-slim
  ResourceRequirement:
    coresMin: 1
    ramMin: 2048
inputs: {}
outputs:
  p_txt:
    type: File
    outputSource: h/output1
    curate:deliver_as: results/p.txt
steps:
  w:
    in: {}
    out:
    - output1
    run:
      class: Operation
      inputs: {}
      outputs:
        output1:
          type: File
          curate:name: notes.txt
    hints:
      curate:function:
        code: functions/w.py
        entrypoint: main
  g:
    in:
      input1:
        source:
        - w/output1
        linkMerge: merge_flattened
        curate:folder: true
    out:
    - output1
    run:
      class: Operation
      inputs:
        input1: File[]
      outputs:
        output1:
          type: File
          curate:name: o.txt
    hints:
      curate:function:
        code: functions/g.py
        entrypoint: main
  h:
    in:
      input1: g/output1
    out:
    - output1
    run:
      class: Operation
      inputs:
        input1: File
      outputs:
        output1:
          type: File
          curate:name: p.txt
    hints:
      curate:function:
        code: functions/h.py
        entrypoint: main
