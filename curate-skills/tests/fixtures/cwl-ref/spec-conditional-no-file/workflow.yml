cwlVersion: v1.2
class: Workflow
$namespaces:
  curate: https://github.com/CURATE-skills/CURATE/blob/main/docs/CWL_IR.md#
label: t4
doc: t4
hints:
  DockerRequirement:
    dockerPull: python:3.12-slim
  ResourceRequirement:
    coresMin: 1
    ramMin: 2048
inputs: {}
outputs:
  a_txt:
    type: File
    outputSource: a/output1
    curate:deliver_as: results/a.txt
  b_txt:
    type: File
    outputSource: b/output1
    curate:deliver_as: results/b.txt
  c_txt:
    type: File
    outputSource: c/output1
    curate:deliver_as: results/c.txt
steps:
  a:
    in: {}
    out:
    - output1
    run:
      class: Operation
      inputs: {}
      outputs:
        output1:
          type: File
          curate:name: a.txt
    hints:
      curate:function:
        code: functions/a.py
        entrypoint: main
  b:
    in: {}
    out:
    - output1
    run:
      class: Operation
      inputs: {}
      outputs:
        output1:
          type: File
          curate:name: b.txt
    hints:
      curate:function:
        code: functions/b.py
        entrypoint: main
  c:
    in: {}
    out:
    - output1
    run:
      class: Operation
      inputs: {}
      outputs:
        output1:
          type: File
          curate:name: c.txt
    hints:
      curate:function:
        code: functions/c.py
        entrypoint: main
      curate:after:
        steps:
        - b
      curate:run_if:
        step: a
        result: true
