cwlVersion: v1.2
class: Workflow
$namespaces:
  curate: https://github.com/CURATE-skills/CURATE/blob/main/docs/CWL_IR.md#
label: t
requirements:
  ScatterFeatureRequirement: {}
hints:
  DockerRequirement:
    dockerPull: python:3.12-slim
inputs:
  w:
    type: string[]
    default:
    - a
    - b
  data_w_csv:
    type: File[]
    default:
    - class: File
      location: inputs/data_a.csv
    - class: File
      location: inputs/data_b.csv
outputs:
  o_w_json:
    type: File[]
    outputSource: m/o
    curate:deliver_as: results/{w}/o.json
steps:
  m:
    scatter:
    - w
    - d
    scatterMethod: dotproduct
    in:
      w: w
      f:
        default: 0.5
      ks:
        default:
        - 1
        - 2
      n:
        default: 3
      'on':
        default: true
      tag:
        default: x
      d: data_w_csv
    out:
    - o
    run:
      class: Operation
      inputs:
        w: string
        f: float
        ks: int[]
        n: int
        'on': boolean
        tag: string
        d: File
      outputs:
        o:
          type: File
          curate:name: o_{w}.json
    hints:
      curate:function:
        code: functions/m.py
        entrypoint: main
