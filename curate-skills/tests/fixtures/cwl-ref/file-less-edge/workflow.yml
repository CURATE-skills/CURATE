cwlVersion: v1.2
class: Workflow
$namespaces:
  curate: https://github.com/CURATE-skills/CURATE/blob/main/docs/CWL_IR.md#
label: t_flow
doc: t_flow
requirements:
  ScatterFeatureRequirement: {}
hints:
  DockerRequirement:
    dockerPull: python:3.12-slim
  ResourceRequirement:
    coresMin: 1
    ramMin: 2048
inputs:
  rank2:
    type: int[]
    default:
    - 1
    - 2
outputs:
  p_rank2_txt:
    type: File[]
    outputSource: a/output1
    curate:deliver_as: results/p_{rank2}.txt
  q_rank2_txt:
    type: File[]
    outputSource: b/output1
    curate:deliver_as: results/q_{rank2}.txt
steps:
  a:
    scatter: rank
    in:
      rank: rank2
      max_rank:
        default: 2
    out:
    - output1
    run:
      class: Operation
      inputs:
        rank: int
        max_rank: int
      outputs:
        output1:
          type: File
          curate:name: p_{rank2}.txt
    hints:
      curate:function:
        code: functions/a.py
        entrypoint: main
  b:
    scatter: rank
    in:
      rank: rank2
      max_rank:
        default: 2
    out:
    - output1
    run:
      class: Operation
      inputs:
        rank: int
        max_rank: int
      outputs:
        output1:
          type: File
          curate:name: q_{rank2}.txt
    hints:
      curate:function:
        code: functions/b.py
        entrypoint: main
      curate:after:
        steps:
        - a
