cwlVersion: v1.2
class: Workflow
$namespaces:
  curate: https://github.com/CURATE-skills/CURATE/blob/main/docs/CWL_IR.md#
  s: https://schema.org/
label: corvallis_winter_weather
doc: Compare Corvallis, Oregon winter 2024-25 daily PRCP, TMIN and TMAX from NOAA
  GHCN with the 10-year average for the same days, and plot one three-panel figure.
s:identifier: corvallis-winter-weather-v1
s:version: '1'
curate:content_hash: sha256:8ce54a5aabf44eb3e2dcb0d1353ee9e5c5775a249f70825883ccd5aa680b1762
requirements:
  ScatterFeatureRequirement: {}
hints:
  DockerRequirement:
    dockerPull: python:3.12-slim
  ResourceRequirement:
    coresMin: 1
    ramMin: 2048
inputs:
  rank3:
    type: int[]
    default:
    - 1
    - 2
    - 3
outputs:
  winter_comparison_png:
    type: File
    outputSource: plot_winter_comparison/output1
    curate:deliver_as: results/winter_comparison.png
steps:
  download_ghcn_daily:
    in: {}
    out:
    - output1
    run:
      class: Operation
      inputs: {}
      outputs:
        output1:
          type: File[]
          curate:axis: rank3
    hints:
      curate:function:
        code: functions/download_ghcn_daily.py
        entrypoint: main
      SoftwareRequirement:
        packages:
        - package: requests
        - package: pandas
  compare_winter_variable:
    scatter:
    - rank
    - input1
    scatterMethod: dotproduct
    in:
      rank: rank3
      max_rank:
        default: 3
      input1: download_ghcn_daily/output1
    out:
    - output1
    run:
      class: Operation
      inputs:
        rank: int
        max_rank: int
        input1: File
      outputs:
        output1: File
    hints:
      curate:function:
        code: functions/compare_winter_variable.py
        entrypoint: main
      SoftwareRequirement:
        packages:
        - package: pandas
  plot_winter_comparison:
    in:
      input1: compare_winter_variable/output1
    out:
    - output1
    run:
      class: Operation
      inputs:
        input1: File[]
      outputs:
        output1: File
    hints:
      curate:function:
        code: functions/plot_winter_comparison.py
        entrypoint: main
      SoftwareRequirement:
        packages:
        - package: pandas
        - package: matplotlib
